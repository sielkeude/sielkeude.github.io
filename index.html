<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 下载测试</title>
  <style>
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 60px 24px;
      color: #1e293b;
      line-height: 1.8;
    }
    h1 { color: #2563eb; }
    .download-btn {
      display: inline-block;
      margin: 8px 8px 8px 0;
      padding: 12px 24px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      transition: background 0.2s;
    }
    .download-btn:hover {
      background: #1e40af;
    }
  </style>
</head>
<body>
  <h1>PDF 下载测试</h1>
  <p>点击下面的按钮，看能不能下载 PDF：</p>

  <a class="download-btn" href="files/sample.pdf" download>
    📄 下载测试 PDF
  </a>
</body>
</html>
